# ============================================================
# ws-control-platform Docker Compose
#
# ADB_MODE 选择 ADB 运行方式:
#   host  - 连接宿主机 ADB（推荐 macOS/Windows，宿主机需运行 adb server）
#   local - 容器内独立 ADB（无需宿主机安装 ADB，首次连接设备需授权）
#   off   - 不使用 ADB
#
# 快速切换:
#   ADB_MODE=host  docker compose up -d   # 有 ADB 的用户
#   ADB_MODE=local docker compose up -d   # 无 ADB 的用户
# ============================================================

services:
  ws-control:
    image: ${DOCKER_IMAGE:-ws-control-platform}:${DOCKER_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ws-control-platform
    restart: unless-stopped
    ports:
      - "28081:28081"
    environment:
      - NODE_ENV=production
      - PORT=33721
      # JWT_SECRET 可选：不配置则通过 Web 初始化流程设置
      # - JWT_SECRET=${JWT_SECRET:-}
      # ---- ADB 配置 ----
      - ADB_MODE=${ADB_MODE:-local}
      - ADB_HOST=${ADB_HOST:-host.docker.internal}
      - ADB_PORT=${ADB_PORT:-5037}
    volumes:
      - ws-control-data:/app/data
      # ADB 密钥持久化（local 模式下避免每次重建容器重新授权）
      - adb-keys:/root/.android
      # host 模式替代方案: 挂载宿主机密钥（取消注释下行，注释上行 adb-keys）
      # - ~/.android:/root/.android:ro
    # Linux USB 设备直通（取消注释以下两行）
    # privileged: true
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb

volumes:
  ws-control-data:
  adb-keys:
